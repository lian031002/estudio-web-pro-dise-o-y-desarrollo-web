<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded badge -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#27272a" stroke-width="2" />
  
  <!-- Subtle ambient glow -->
  <circle cx="50" cy="50" r="30" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Stylized Geometric "B" + Web Code Bracket -->
  <!-- Left vertical spine & bracket -->
  <path d="M28 22H46C56 22 64 28 64 37C64 43 60 48 54 50C62 52 68 58 68 67C68 76 60 82 48 82H28V22Z" 
        stroke="url(#brandGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Inner upper loop -->
  <path d="M42 36H46C50 36 53 38 53 42C53 46 50 48 46 48H42V36Z" 
        fill="#34d399" 
        opacity="0.9" />

  <!-- Inner lower loop -->
  <path d="M42 56H48C52 56 56 59 56 64C56 68 52 71 48 71H42V56Z" 
        fill="#10b981" 
        opacity="0.9" />

  <!-- Code forward slash line cutting through dynamically -->
  <line x1="58" y1="20" x2="42" y2="84" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.85" />
</svg>
